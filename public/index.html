<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeCraft AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--card:#fff;--ink:#23211f;--mute:#6f6a62;--sage:#7d9a82;--sageD:#4f6b55;--coral:#e8735a;--line:#e7dfd2;--r:18px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--card:#262421;--ink:#f1ebe0;--mute:#a39d92;--sage:#8fae94;--sageD:#5f8466;--line:#3a3733}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.1;margin:0 0 .5em}h1{font-size:clamp(2.4rem,7vw,4.6rem);letter-spacing:-.02em}h2{font-size:clamp(1.7rem,4vw,2.4rem)}h3{font-size:clamp(1.2rem,2vw,1.5rem)}p{margin:0 0 1em}a{color:inherit}.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:16px;height:60px}.logo{display:flex;align-items:center;gap:8px;font:600 1.2rem Fraunces,serif;text-decoration:none;white-space:nowrap}
nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto}nav a{padding:8px 12px;border-radius:99px;text-decoration:none;color:var(--mute);font-size:.92rem;white-space:nowrap}nav a.on,nav a:hover{background:var(--card);border:1px solid var(--line)}
.stack{display:grid;gap:16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.col{display:grid;gap:16px}
.btn{display:inline-block;border:0;border-radius:99px;padding:12px 22px;font:600 .95rem Inter,sans-serif;cursor:pointer;text-decoration:none;background:var(--coral);color:#fff}.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.sm{padding:8px 14px;font-size:.82rem}.btn.sg{background:var(--sageD)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-width:100%}input[type=text],input[type=password],input[type=number]{width:100%}.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer}.chip.on{background:var(--sage);border-color:var(--sage);color:#fff}.chip button{all:unset;cursor:pointer}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0}@media(max-width:800px){.hero{grid-template-columns:1fr;padding:32px 0}}
.art{display:grid;grid-template-columns:1fr 1fr;gap:12px}.art div{border-radius:24px;aspect-ratio:3/4;display:grid;place-items:end start;padding:16px;font:600 1rem Fraunces,serif;color:#fff}.art .a{background:linear-gradient(180deg,#b7c7b0,#718a68)}.art .b{background:linear-gradient(180deg,#d8c6a8,#bb8d5c)}.art .c{background:linear-gradient(180deg,#d2b8ba,#996f6d)}.art .d{background:linear-gradient(180deg,#bfd1d3,#72919c)}
section{padding:40px 0}.mute{color:var(--mute)}.ph{aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,var(--sage),#c9d8c5);background-size:cover;background-position:center;display:grid;place-items:end start;padding:16px;color:#fff;font:600 1rem Fraunces,serif}
.sk{height:260px;border-radius:var(--r);background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:9;font-size:.9rem;max-width:90vw}
.err{border-color:var(--coral)}.badge{font-size:.75rem;background:var(--coral);color:#fff;border-radius:99px;padding:2px 10px}.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--sageD));border-radius:inherit}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;background:var(--bg);padding:10px;border-radius:14px;margin:10px 0}.board figure{margin:0;text-align:center;font-size:.84rem}.board img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.drop{border:2px dashed var(--sage);border-radius:var(--r);padding:28px;text-align:center;cursor:pointer;color:var(--ink)}ol.steps{padding:0;list-style:none;display:grid;gap:12px}ol.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.ol.steps li::before{content:attr(data-index)}
.ck{display:flex;gap:10px;align-items:center;color:var(--ink);font-size:1rem;margin:6px 0}.ck.done span{text-decoration:line-through;color:var(--mute)}
footer{border-top:1px solid var(--line);padding:30px 0;color:var(--mute);font-size:.9rem}
@media print{header,footer,.noprint{display:none!important}}
</style></head><body>
<header><div class="wrap"><a class="logo" href="#/home"><svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#7d9a82"/><path d="M9 20c0-6.2 7-9.8 8.8-13.4 1.4 3.2 5.7 5.6 8.4 9.4-2.3 0-3.8 1.1-5.1 3.1-1.4 2.4-2.4 3.9-6.5 3.9-3.6 0-4.7-1.4-5.6-2.9z" fill="#fff"/></svg>LifeCraft AI</a>
<nav aria-label="Main"><a href="#/home">Home</a><a href="#/kitchen">Kitchen</a><a href="#/wardrobe">Wardrobe</a><a href="#/plan">Plan</a><a href="#/saved">Saved</a><a href="#/settings">Settings</a></nav></div></header>
<main class="wrap" id="app" tabindex="-1"></main>
<footer><div class="wrap stack"><div>LifeCraft AI. Make the most of what you already have.</div><div>Privacy: ingredients and clothing photos you submit are sent to an AI service to produce your results.</div></div></footer>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Browser storage is full or blocked.')}}};
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3200)}
const uid=()=>Math.random().toString(36).slice(2,9);
const ALLOW_USER_KEYS=false;
const P={groq:{base:'https://api.groq.com/openai/v1',model:'llama-3.3-70b-versatile',vmodel:'meta-llama/llama-4-scout-17b-16e-instruct'},openai:{base:'https://api.openai.com/v1',model:'gpt-4o-mini',vmodel:'gpt-4o-mini'}};
const cfg=()=>S.get('cfg',null)||{p:'groq',key:'',base:P.groq.base,model:P.groq.model,vmodel:P.groq.vmodel};
let AI=false;
async function ping(){try{const c=new AbortController();setTimeout(()=>c.abort(),4000);const r=await fetch('/api/ai',{signal:c.signal});AI=!!(await r.json()).ok}catch{AI=false}}
async function llm(messages,vision){const c=cfg(),direct=ALLOW_USER_KEYS&&c.key,ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),50000); try{const r=direct?await fetch(c.base.replace(/\/$/, '')+'/chat/completions',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+c.key},body:JSON.stringify({model:c.model,messages,temperature:0.7,max_tokens:1200,vision})}):await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,vision})}); clearTimeout(t); if(!r.ok) throw Error('The AI service is not available right now.'); const j=await r.json(); const txt=direct?j.choices[0].message.content:j.content; return JSON.parse(txt.replace(/```json|```/g,'').trim())} catch(e){if(e.name=='AbortError')throw Error('The AI took too long to respond. Try again.'); if(e instanceof SyntaxError)throw Error('The AI returned unreadable data. Try again.'); throw e}}
let ING=[],RES=[],CUR=null,SERV=0,DEMO=false,OUT=[],W=S.get('wd',[]),FIL='all',FQ='';
const SP=/cumin|turmeric|chil+i|masala|coriander|garam|pepper|paprika|oregano|cardamom|cinnamon|mustard|hing|spice/; const PA=/^(salt|oil|ghee|butter|sugar|flour|vinegar|soy sauce)/;
const kind=n=>SP.test(n)?'spice':PA.test(n)?'pantry':'main';
const parse=t=>t.toLowerCase().replace(/\bi (have|got)\b/g,'').split(/,|;|\n|\band\b/).map(x=>x.replace(/[^a-z \-]/g,'').trim()).filter(x=>x.length>1);
const hit=(a,b)=>a.includes(b)||b.includes(a);
const PANTRY={Vegetables:['potato','onion','tomato','spinach','capsicum','carrot','green chilli'],Staples:['rice','wheat flour','lentils','bread','pasta','oil','salt'],Dairy:['paneer','curd','milk','yogurt','cheese'],Herbs:['garlic','ginger','coriander','mint','basil']};
const DEMOR=[{name:'Jeera Rice',description:'Fragrant cumin rice, ready in 25 minutes.',cuisine:'Indian',meal:'lunch',prepMin:5,cookMin:20,difficulty:'easy',servings:2,calories:320,protein:6,ingredients:[{name:'rice',qty:'1 cup'},{name:'cumin',qty:'1 tsp'},{name:'onion',qty:'1'}],steps:['Wash the rice and soak for 10 minutes.','Sauté cumin and onion until fragrant.','Add rice and water, cover and cook.'],tips:'Pair with yogurt or a quick curry.'},{name:'Aloo Pyaaz Sabzi',description:'Simple potato and onion stir-fry.',cuisine:'Indian',meal:'dinner',prepMin:10,cookMin:20,difficulty:'easy',servings:2,calories:240,protein:4,ingredients:[{name:'potato',qty:'2'},{name:'onion',qty:'1'},{name:'turmeric',qty:'1/2 tsp'}],steps:['Dice potatoes and onions.','Cook until golden and tender.','Season with turmeric, salt, and chilli.'],tips:'Excellent with flatbread.'},{name:'Tomato Paneer Masala',description:'Soft paneer in a spiced tomato gravy.',cuisine:'Indian',meal:'dinner',prepMin:10,cookMin:20,difficulty:'medium',servings:3,calories:380,protein:16,ingredients:[{name:'paneer',qty:'200 g'},{name:'tomato',qty:'2'},{name:'garlic',qty:'3 cloves'}],steps:['Blend tomato and garlic into a gravy base.','Sauté and add paneer.','Simmer until thick.'],tips:'Serve with rice or roti.'}];
const V={}; let RT=(()=>{try{return(location.hash||'#/').slice(2).split('/')[0]||'home'}catch{return'home'}})();
function route(){const h=V[RT]?RT:'home';$$('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+h));V[h]();scrollTo(0,0)}
function go(p){RT=p;try{history.pushState(null,'','#/'+p)}catch{}route()}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#/"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(2))}});
addEventListener('popstate',()=>{try{RT=(location.hash||'#/').slice(2).split('/')[0]||'home'}catch{RT='home'}route()});
V.home=()=>{$('#app').innerHTML=`<div class="hero"><div><h1>Make more with what you have.</h1><p class="mute" style="font-size:1.15rem;max-width:34em">Turn the ingredients in your kitchen into incredible meals and the clothes in your closet into outfits that actually work.</p><div class="row" style="margin-top:18px"><a class="btn" href="#/kitchen">Try the kitchen</a><a class="btn alt" href="#/wardrobe">Style your wardrobe</a></div></div><div class="art"><div class="a">Fridge find</div><div class="b">Dinner plan</div><div class="c">New look</div><div class="d">Weekend prep</div></div></div><section><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>AI Kitchen</h3><p class="mute">Add what's in your kitchen and get recipes you can actually cook tonight.</p></div><div class="card"><h3>AI Wardrobe</h3><p class="mute">Upload pieces, search by color/style, and generate outfits with what you already own.</p></div><div class="card"><h3>Weekly plan</h3><p class="mute">Turn your saved recipes and saved outfits into a realistic week.</p></div></div></section><section><h2>How it works</h2><div class="grid"><div class="card"><h3>1. Add what you have</h3><p class="mute">Type ingredients or upload clothing photos.</p></div><div class="card"><h3>2. Let the AI match</h3><p class="mute">We prioritize foods and outfit combinations you can make immediately.</p></div><div class="card"><h3>3. Save and plan</h3><p class="mute">Keep what works, build the week, and reduce waste.</p></div></div></section><section><h2>Why use what you own</h2><p class="mute" style="max-width:40em">Cooking from your pantry cuts food waste and last-minute shopping. Re-wearing clothes in new combinations means fewer impulse buys and more confidence in the pieces you already love.</p></section><section><h2>Recipes to try</h2><div class="grid">${DEMOR.map(r=>`<a class="card" href="#/kitchen" style="text-decoration:none"><h3>${r.name}</h3><p class="mute">${r.description}</p></a>`).join('')}</div></section>`};
V.kitchen=()=>{const hs=S.get('hist',[]);$('#app').innerHTML=`<section><h2>AI Kitchen</h2><div class="card"><label for="ii">Ingredients (type one, or paste a comma-separated list)</label><div class="row" style="margin-top:10px"><input id="ii" type="text" placeholder="potatoes, onions, rice, paneer..." style="flex:1"><button class="btn sm" id="addb">Add</button></div><div id="chips" style="margin-top:12px"></div><div class="row" style="margin-top:12px">${Object.entries(PANTRY).map(([k,v])=>`<button class="chip q" data-i="${esc(k)}">${k}</button>`).join('')}</div>${hs.length?`<details style="margin-top:10px"><summary class="mute">Recent searches</summary><div class="row" style="margin-top:8px">${hs.map((h,i)=>`<button class="chip" data-h="${i}">${esc(h.slice(0,22))}</button>`).join('')}</div></details>`:''}<details style="margin-top:10px"><summary class="mute">Preferences</summary><div class="grid" style="margin-top:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"><label>Cuisine<select id="pc"><option value="">Any</option><option>Indian</option><option>Italian</option><option>Chinese</option><option>Mexican</option><option>Continental</option></select></label><label>Meal<select id="pm"><option value="">Any</option><option>breakfast</option><option>lunch</option><option>dinner</option><option>snack</option><option>dessert</option></select></label><label>Diet<select id="pd"><option value="">None</option><option>vegetarian</option><option>vegan</option><option>egg-free</option><option>gluten-free</option></select></label><label>Max time (min)<input id="pt" type="number" min="5" placeholder="Any"></label><label>Difficulty<select id="pf"><option value="">Any</option><option>easy</option><option>medium</option><option>advanced</option></select></label><label>Spice<select id="ps"><option value="">Any</option><option>mild</option><option>medium</option><option>hot</option></select></label><label>Servings<input id="pv" type="number" min="1" value="2"></label><label>Equipment<input id="pe" type="text" placeholder="stove, oven..."></label></div></details><div class="row" style="margin-top:16px"><button class="btn" id="go">Find recipes</button><button class="btn alt" id="sur">Surprise me</button></div></div><div id="res" style="margin-top:24px"></div></section>`;drawChips(); const add=()=>{addIng($('#ii').value);$('#ii').value=''}; $('#addb').onclick=add; $('#ii').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();add()}}; $$('.q').forEach(b=>b.onclick=()=>{ING.includes(b.dataset.i)?ING=ING.filter(x=>x!=b.dataset.i):ING.push(b.dataset.i);drawChips()}); $$('[data-h]').forEach(b=>b.onclick=()=>{ING=parse(hs[+b.dataset.h]);drawChips()}); $('#go').onclick=()=>gen(false); $('#sur').onclick=()=>gen(true); if(RES.length)drawRes();
function addIng(t){parse(t).forEach(x=>{if(!ING.includes(x))ING.push(x)});drawChips()}
function drawChips(){const c=$('#chips');if(!c)return;c.innerHTML=ING.length?ING.map(i=>`<span class="chip ${kind(i)}">${esc(i)} <button aria-label="Remove ${esc(i)}" data-r="${esc(i)}">×</button></span>`).join(''):'<span class="mute">No ingredients added yet.</span>'; $$('[data-r]').forEach(b=>b.onclick=()=>{ING=ING.filter(x=>x!=b.dataset.r);drawChips()}); $$('.q').forEach(b=>b.classList.toggle('on',ING.includes(b.dataset.i)))}};
const SYSR='You are a careful chef. Return ONLY JSON: {"recipes":[{"name","description","cuisine","meal","prepMin":n,"cookMin":n,"difficulty","servings":n,"calories":n,"protein":n,"ingredients":[{"name","qty"}],"steps":["..."],"tips":"...","substitutions":"...","storage":"..."}]}';
function validR(r){if(!r||typeof r.name!='string'||!Array.isArray(r.ingredients)||!Array.isArray(r.steps)||!r.steps.length)return null; return{id:uid(),name:r.name,description:r.description||'',cuisine:r.cuisine||'',meal:r.meal||'',prepMin:+r.prepMin||0,cookMin:+r.cookMin||0,difficulty:r.difficulty||'',servings:+r.servings||2,calories:+r.calories||0,protein:+r.protein||0,ingredients:r.ingredients.map(g=>({name:String(g.name||'').trim(),qty:String(g.qty||'')})).filter(g=>g.name),steps:r.steps.map(String).filter(Boolean),tips:r.tips||'',substitutions:r.substitutions||'',storage:r.storage||''}};
const used=r=>r.ingredients.filter(g=>ING.some(i=>hit(g.name,i))), miss=r=>r.ingredients.filter(g=>g.name!='water'&&!ING.some(i=>hit(g.name,i)));
async function gen(sur){if(!ING.length&&!sur)return toast('Add at least one ingredient first.'); const pref={cuisine:$('#pc').value,meal:$('#pm').value,diet:$('#pd').value,maxMinutes:$('#pt').value,difficulty:$('#pf').value,spice:$('#ps').value,servings:$('#pv').value,equipment:$('#pe').value}; $('#res').innerHTML='<div class="grid">'+'<div class="sk"></div>'.repeat(3)+'</div>'; try{if(AI){DEMO=false;const j=await llm([{role:'system',content:SYSR},{role:'user',content:JSON.stringify({ingredients:ING,preferences:pref,surprise:sur})}]); RES=(j.recipes||[]).map(validR).filter(Boolean); if(!RES.length)throw Error('No recipes matched your ingredients.')} else {DEMO=true;RES=DEMOR.map(validR).filter(Boolean)} if(ING.length){const k=ING.join(', '),h=S.get('hist',[]).filter(x=>x!=k);h.unshift(k);S.set('hist',h.slice(0,6))} drawRes()} catch(e){$('#res').innerHTML=`<div class="card err" role="alert"><h3>Couldn't get recipes</h3><p>${esc(e.message)}</p><button class="btn sm" id="rt">Retry</button></div>`;$('#rt').onclick=()=>gen(sur)}};
function drawRes(){const el=$('#res');if(!el)return;const so=el.dataset.so||'match',only=el.dataset.only=='1';let L=[...RES]; if(only)L=L.filter(r=>!miss(r).length); const t=r=>r.prepMin+r.cookMin; L.sort((a,b)=>so=='fast'?t(a)-t(b):so=='few'?miss(a).length-miss(b).length:so=='prot'?b.protein-a.protein:used(b).length-used(a).length); el.innerHTML=`${DEMO?'<p class="card" style="padding:12px">The AI service is offline, so these are sample recipes.</p>':''}<div class="row" style="margin:12px 0"><label>Sort<select id="so"><option value="match">Best match</option><option value="fast">Fastest</option><option value="few">Fewest missing</option><option value="prot">Highest protein</option></select></label><label><input id="only" type="checkbox">Only recipes with everything I have</label></div>${L.length?`<div class="grid">${L.map(r=>`<article class="card"><div class="ph" data-img="${esc(r.name)}">${esc(r.name)}</div><h3>${esc(r.name)}</h3><p class="mute">${esc(r.description)}</p><p style="margin:0 0 8px"><span class="badge">${esc(r.cuisine||'Any')}</span> <span class="mute">${r.prepMin+r.cookMin} min</span></p><div class="row"><button class="btn sm" data-o="${r.id}">Open</button><span class="mute">${used(r).length} ingredients matched</span></div></article>`).join('')}</div>`:'<div class="card"><h3>No matches yet</h3><p class="mute">Try adding more ingredients or loosen the filter.</p></div>'}`; $('#so').value=so; $('#so').onchange=e=>{el.dataset.so=e.target.value;drawRes()}; $('#only').onchange=e=>{el.dataset.only=e.target.checked?'1':'0';drawRes()}; $$('[data-o]').forEach(b=>b.onclick=()=>{CUR=RES.find(r=>r.id==b.dataset.o);SERV=CUR.servings;go('recipe')}); loadImgs(el)};
const IC={}; async function dishImg(n){if(n in IC)return IC[n]; const k='img:'+n,c=S.get(k,null); if(c)return IC[n]=c; try{const ctl=new AbortController(); setTimeout(()=>ctl.abort(),6000); const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&prop=pageimages&piprop=original&redirects=1&gsrsearch='+encodeURIComponent(n)); const j=await r.json(); const p=(j.query&&j.query.pages&&Object.values(j.query.pages)[0])||null; const u=p&&p.original?p.original.source:null; if(u){S.set(k,u); IC[n]=u; return u} }catch{} return null }
function loadImgs(el){$$('[data-img]',el).forEach(async d=>{const u=await dishImg(d.dataset.img); if(u){d.style.backgroundImage=`url("${u}")`; d.textContent=''; d.title='Photo via Wikipedia. May show a related dish.'}})};
function addShop(names){const a=S.get('sl',[]); let n=0; names.forEach(x=>{if(!a.some(i=>i.name==x)){a.push({id:uid(),name:x,done:false}); n++}}); S.set('sl',a); toast(n?n+' item(s) added to your shopping list.':'Already on your list.')} 
V.recipe=()=>{const r=CUR;if(!r){go('kitchen');return}const f=SERV/r.servings,sc=q=>q?+(q*f).toFixed(2):'',m=miss(r).map(x=>x.name); const tm=s=>{const x=s.match(/(\d+)(?:\s*(?:-|to)\s*\d+)?\s*(?:minutes?|mins?)\b/i); return x?` <button class="chip tmr noprint" data-m="${x[1]}">Timer ${x[1]} min</button>`:''}; $('#app').innerHTML=`<section><a href="#/kitchen" class="noprint mute">Back to recipes</a><div class="ph" data-img="${esc(r.name)}" style="aspect-ratio:16/7;margin-top:12px">${esc(r.name)}</div><small class="mute">${esc(r.cuisine||'Unknown cuisine')} · ${esc(r.meal||'Any')} · ${r.prepMin+r.cookMin} min</small><h2 style="margin-top:10px">${esc(r.name)}</h2><p>${esc(r.description)}</p><div class="row noprint"><button class="btn sm" id="sv">Save recipe</button>${m.length?'<button class="btn sm sg" id="sl">Add missing to shopping list</button>':''}<button class="btn sm alt" onclick="go('kitchen')">Back</button></div><div class="grid" style="margin-top:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div class="card"><h3>Ingredients</h3><div class="row noprint" style="margin-bottom:10px">Servings <button class="btn sm alt" id="mi">−</button> <span id="svn">${SERV}</span> <button class="btn sm alt" id="pl">+</button></div><ul>${r.ingredients.map(i=>`<li>${esc(i.qty||'')} ${esc(i.name)}</li>`).join('')}</ul></div><div class="card"><h3>Method</h3><div class="bar"><i id="pb" style="width:0"></i></div><ol class="steps" style="margin-top:12px">${r.steps.map((s,i)=>`<li data-index="${i+1}"><input type="checkbox" class="st"><span>${esc(s)}${tm(s)}</span></li>`).join('')}</ol></div></div>${r.tips||r.substitutions||r.storage?`<div class="card" style="margin-top:16px">${r.tips?`<p><b>Tip:</b> ${esc(r.tips)}</p>`:''}${r.substitutions?`<p><b>Substitutions:</b> ${esc(r.substitutions)}</p>`:''}${r.storage?`<p><b>Storage:</b> ${esc(r.storage)}</p>`:''}</div>`:''}</section>`; loadImgs($('#app')); $('#mi').onclick=()=>{SERV=Math.max(1,SERV-1);V.recipe()}; $('#pl').onclick=()=>{SERV++;V.recipe()}; $$('.st').forEach(c=>c.onchange=()=>{$('#pb').style.width=$$('.st:checked').length/r.steps.length*100+'%'}); $$('.tmr').forEach(b=>b.onclick=()=>{if(b.t)return;let s=+b.dataset.m*60;const show=()=>b.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');show();b.t=setInterval(()=>{s--;show();if(s<=0){clearInterval(b.t);b.t=null;toast('Timer done')}} ,1000)}); $('#sv').onclick=()=>{const a=S.get('sr',[]); if(!a.some(x=>x.id==r.id)){a.push(r);S.set('sr',a)}toast('Recipe saved')}; if($('#sl'))$('#sl').onclick=()=>addShop(m)};
const CATS=['top','bottom','footwear','outerwear','accessory','bag'];
const resize=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;const x=c.getContext('2d');x.drawImage(i,0,0,c.width,c.height);c.toBlob(blob=>ok(blob?URL.createObjectURL(blob):u), 'image/jpeg', 0.82);};i.onerror=no;i.src=u});
async function analyze(it){const j=await llm([{role:'user',content:[{type:'text',text:'Classify this clothing item. Return JSON {"category":"top|bottom|footwear|outerwear|accessory|bag","color":"","pattern":"","style":"","tags":[...]}'},{type:'image_url',image_url:{url:it.img}}]}],true); if(CATS.includes(j.category))it.cat=j.category; if(j.color)it.color=j.color; if(j.pattern)it.pattern=j.pattern; if(j.style)it.style=j.style; if(Array.isArray(j.tags))it.tags=j.tags.slice(0,5)}
async function upload(files){const ok=[...files].filter(f=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast(f.name+': use JPG, PNG or WebP');return false} if(f.size>8e6){toast(f.name+': over 8 MB');return false} return true}); for(const f of ok){try{const it={id:uid(),img:await resize(f),cat:'top',color:'',pattern:'',style:'',tags:[]}; $('#st').textContent='Processing '+f.name+'...'; if(AI){try{await analyze(it)}catch(e){toast('Photo analysis failed for '+f.name);}} W.unshift(it); S.set('wd',W); drawGrid();}catch{toast('Could not read '+f.name)}}}
V.wardrobe=()=>{$('#app').innerHTML=`<section><h2>AI Wardrobe</h2><label class="drop" for="fi"><b>Drop photos here or tap to choose</b><br><span class="mute">JPG, PNG or WebP, up to 8 MB each. ${AI?'AI is online and can label photos automatically.':'AI is offline, so items will be added manually.'}</span></label><input type="file" id="fi" accept="image/jpeg,image/png,image/webp" multiple hidden><div class="row" id="fl" style="margin:10px 0"></div><input type="text" id="fq" placeholder="Search by color, style or tag" aria-label="Search wardrobe" style="max-width:320px;margin-bottom:12px" value="${esc(FQ)}"><div class="board" id="gr"></div><div class="card" id="ins"></div><h2 style="margin-top:40px">Outfit generator</h2><div class="card"><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))"><label>Occasion<select id="oc"><option>Casual everyday</option><option>Work</option><option>Weekend</option><option>Brunch</option><option>Evening</option></select></label><button class="btn" id="goOut">Generate outfits</button></div></div><div id="out" style="margin-top:16px"></div></section>`; const dz=$('.drop');['dragover','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();if(ev=='drop')upload(e.dataTransfer.files)})); $('#fi').onchange=e=>{upload(e.target.files);e.target.value=''}; $('#fq').oninput=e=>{FQ=e.target.value; drawGrid()}; $('#goOut').onclick=()=>outfits(); drawGrid(); drawOut();};
function drawGrid(){const g=$('#gr');if(!g)return;$('#fl').innerHTML=['all',...CATS].map(c=>`<button class="chip ${FIL==c?'on':''}" data-f="${c}">${c}</button>`).join('');$$('[data-f]').forEach(b=>b.onclick=()=>{FIL=b.dataset.f;drawGrid()}); const q=FQ.toLowerCase().trim(),L=W.filter(w=>(FIL=='all'||w.cat==FIL)&&(!q||[w.color,w.style,w.pattern,w.cat,...(w.tags||[])].join(' ').toLowerCase().includes(q))); g.innerHTML=L.length?L.map(w=>`<div class="card" style="padding:10px"><img src="${w.img}" alt="${esc(w.cat)} ${esc(w.color)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px"><div class="row" style="margin-top:8px"><select data-c="${w.id}" style="flex:1"><option value="top" ${w.cat=='top'?'selected':''}>top</option><option value="bottom" ${w.cat=='bottom'?'selected':''}>bottom</option><option value="footwear" ${w.cat=='footwear'?'selected':''}>footwear</option><option value="outerwear" ${w.cat=='outerwear'?'selected':''}>outerwear</option><option value="accessory" ${w.cat=='accessory'?'selected':''}>accessory</option><option value="bag" ${w.cat=='bag'?'selected':''}>bag</option></select><button class="btn sm alt" data-d="${w.id}">Remove</button></div><div class="row" style="margin-top:6px"><input data-k="${w.id}" value="${esc(w.color)}" placeholder="color"><input data-t="${w.id}" value="${esc((w.tags||[]).join(', '))}" placeholder="tags"></div></div>`).join(''):'<div class="card"><p class="mute">No items match your filters.</p></div>'; $$('[data-c]').forEach(s=>s.onchange=()=>{W.find(w=>w.id==s.dataset.c).cat=s.value;S.set('wd',W);drawGrid()}); $$('[data-k]').forEach(s=>s.onchange=()=>{W.find(w=>w.id==s.dataset.k).color=s.value;S.set('wd',W)}); $$('[data-t]').forEach(s=>s.onchange=()=>{W.find(w=>w.id==s.dataset.t).tags=s.value.split(',').map(x=>x.trim()).filter(Boolean);S.set('wd',W)}); $$('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Remove this item from your wardrobe?')){W=W.filter(w=>w.id!=b.dataset.d);S.set('wd',W);drawGrid()}}); drawIns()} 
function drawIns(){const e=$('#ins');if(!e||!W.length){if(e)e.innerHTML='';return}const cn={};W.forEach(w=>{const c=(w.color||'').toLowerCase().trim();if(c)cn[c]=(cn[c]||0)+1});const top=Object.entries(cn).sort((a,b)=>b[1]-a[1]).slice(0,3); e.innerHTML=`<div class="card"><h3>Wardrobe insights</h3><p class="mute">${W.length} items: ${CATS.filter(c=>W.some(w=>w.cat==c)).map(c=>W.filter(w=>w.cat==c).length+' '+c).join(', ')}.${top.length?' Most common colors: '+top.map(([c,n])=>c+' ('+n+')').join(', '):''}</p></div>`}
const NEU=/black|white|grey|gray|beige|navy|cream|tan|denim|khaki/i; const by=c=>W.filter(w=>w.cat==c); const pick=a=>a[Math.floor(Math.random()*a.length)]; function pickC(c){const l=by(c),m=l.filter(w=>w.must); return pick(m.length?m:l)}
function localOutfits(oc){return[0,1,2].map(n=>{const top=pickC('top'),bot=pickC('bottom'),sh=pickC('footwear'),ou=pickC('outerwear'),ac=pickC('accessory'); const it={};[top,bot,sh,ou,ac].forEach(x=>x&&(it[x.cat]=x.id)); const bal=NEU.test((top||{}).color||'')||NEU.test((bot||{}).color||''); return{id:uid(),name:['Everyday Ease','Clean Lines','Easy Contrast'][n],occasion:oc,items:it,rule:true,why:bal?'A neutral piece keeps the pairing balanced.':'A contrast between pieces adds interest while keeping it wearable.'}})};
async function outfits(){if(!by('top').length||!by('bottom').length)return toast('Add at least one top and one bottom first.'); const oc=$('#oc').value; const o=$('#out'); o.innerHTML='<div class="sk"></div>'; try{if(AI){const inv=W.map(w=>({id:w.id,category:w.cat,color:w.color,pattern:w.pattern,style:w.style,tags:w.tags})); const j=await llm([{role:'system',content:'You are a stylist. Use ONLY items from the wardrobe list. Return JSON {"outfits":[{"name":"","itemIds":[...] }]}.'},{role:'user',content:JSON.stringify({occasion:oc,items:inv})}],false); OUT=(j.outfits||[]).map(x=>{const it={};(x.itemIds||[]).forEach(id=>{const w=W.find(q=>q.id==id);if(w)it[w.cat]=w.id}); return Object.keys(it).length>=2?{id:uid(),name:x.name||'Outfit',occasion:oc,items:it,why:'Styled from your wardrobe.'}:null}).filter(Boolean); if(!OUT.length)OUT=localOutfits(oc); } else {OUT=localOutfits(oc); toast('AI is offline: showing simple rule-based outfits.')} drawOut()}catch(e){o.innerHTML=`<div class="card err" role="alert" style="grid-column:1/-1"><p>${esc(e.message)}</p></div>`}};
function oCard(o,saved){const LK=S.get('lk',{}), wi=c=>W.find(w=>w.id==o.items[c]); return`<article class="card"><h3>${esc(o.name)}</h3><span class="mute" style="font-size:.85rem">${esc(o.occasion)} · ${Object.keys(o.items).length} items</span><p>${esc(o.why)}</p><div class="board">${Object.entries(o.items).map(([c,id])=>`<figure><img src="${wi(id).img}" alt="${esc(c)}"><figcaption>${esc(c)}</figcaption></figure>`).join('')}</div><div class="row"><button class="btn sm" data-v="${o.id}">Save</button><button class="btn sm alt" data-sh="${o.id}">Share</button><button class="btn sm alt" data-l="${o.id}">👍 ${LK[o.id]==1?1:0}</button><button class="btn sm alt" data-n="${o.id}">👎 ${LK[o.id]==-1?1:0}</button></div></article>`; }
function drawOut(){const el=$('#out'); if(!el||!OUT.length)return; el.innerHTML=OUT.map(o=>oCard(o)).join(''); $$('[data-v]').forEach(b=>b.onclick=()=>{const a=S.get('so',[]),o=OUT.find(x=>x.id==b.dataset.v); if(!a.some(x=>x.id==o.id))a.push(o); S.set('so',a); toast('Outfit saved')}); $$('[data-sh]').forEach(b=>b.onclick=()=>share(OUT.find(x=>x.id==b.dataset.sh))); $$('[data-l]').forEach(b=>b.onclick=()=>{const k=S.get('lk',{}); k[b.dataset.l]=k[b.dataset.l]==1?0:1; S.set('lk',k); drawOut()}); $$('[data-n]').forEach(b=>b.onclick=()=>{const k=S.get('lk',{}); k[b.dataset.l]=k[b.dataset.l]==-1?0:-1; S.set('lk',k); drawOut()});}
function share(o){const t=`${o.name}: ${Object.entries(o.items).map(([c,id])=>((W.find(w=>w.id==id)||{}).color||'')+' '+c).join(', ')}. ${o.why}`; if(navigator.share){navigator.share({title:o.name,text:t}).catch(()=>{})}else{navigator.clipboard?.writeText(t); toast('Outfit details copied to clipboard.')}}
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
V.plan=()=>{const R=S.get('sr',[]),O=S.get('so',[]),SL=S.get('sl',[]),MP=S.get('mp',{}),OP=S.get('op',{}); const planner=(L,store,lab,empty)=>L.length?DAYS.map(d=>`<label class="ck" style="justify-content:space-between">${d}<select data-p="${store}" data-d="${d}" style="max-width:60%"><option value="">Not planned</option>${L.map(x=>`<option value="${esc(x.id)}" ${MP[d]==x.id||OP[d]==x.id?'selected':''}>${esc(lab(x))}</option>`).join('')}</select></label>`).join(''):`<p class="mute">${empty}</p>`; $('#app').innerHTML=`<section class="stack"><h2>Plan</h2><div class="card"><h3>Shopping list</h3><div class="row"><input id="si" type="text" placeholder="Add an item" style="flex:1" aria-label="New shopping item"><button class="btn sm sg" id="sa">Add</button>${SL.length?'<button class="btn sm alt" id="sx">Clear done</button>':''}</div><div class="stack" style="margin-top:12px">${SL.length?SL.map(i=>`<label class="ck ${i.done?'done':''}"><input type="checkbox" data-sc="${i.id}" ${i.done?'checked':''}><span>${esc(i.name)}</span></label>`).join(''):'<p class="mute">No items yet.</p>'}</div></div><div class="card"><h3>Weekly meal planner</h3>${planner(R,'mp',r=>r.name,'Save a recipe first, then plan your week here.')}</div><div class="card"><h3>Weekly outfit planner</h3>${planner(O,'op',o=>o.name+' ('+o.occasion+')','Save an outfit first, then plan your week here.')}</div><div class="card"><h3>Trip packing list</h3><div class="row"><label>Days<input id="pd" type="number" min="1" value="3" style="width:90px"></label><button class="btn sm sg" id="pk">Generate</button></div><div id="po" style="margin-top:12px"></div></div></section>`; const addS=()=>{const v=$('#si').value.trim(); if(!v)return toast('Type an item first.'); addShop([v.toLowerCase()]); V.plan()}; $('#sa').onclick=addS; $('#si').onkeydown=e=>{if(e.key=='Enter')addS()}; $$('[data-sc]').forEach(c=>c.onchange=()=>{SL.find(i=>i.id==c.dataset.sc).done=c.checked;S.set('sl',SL);V.plan()}); if($('#sx'))$('#sx').onclick=()=>{S.set('sl',SL.filter(i=>!i.done));V.plan()}; $$('[data-p]').forEach(s=>s.onchange=()=>{const st=s.dataset.p,m=st=='mp'?MP:OP; m[s.dataset.d]=s.value; S.set(st,m); toast('Plan updated')}); $('#pk').onclick=()=>{const n=Math.max(1,+$('#pd').value||3), need={top:n,bottom:Math.ceil(n/2),footwear:Math.min(2,Math.ceil(n/3)),outerwear:1,accessory:2}; $('#po').innerHTML=Object.entries(need).map(([k,v])=>`<p class="mute">${k}: ${v}</p>`).join('')} };
V.saved=()=>{const R=S.get('sr',[]),O=S.get('so',[]);$('#app').innerHTML=`<section><h2>Saved</h2><h3>Recipes</h3>${R.length?`<div class="grid">${R.map(r=>`<div class="card"><h3>${esc(r.name)}</h3><p class="mute">${esc(r.description)}</p><div class="row"><button class="btn sm" data-o="${r.id}">Open</button><button class="btn sm alt" data-r="${r.id}">Remove</button></div></div>`).join('')}</div>`:'<p class="mute">No saved recipes yet.</p>'}<h3 style="margin-top:30px">Outfits</h3>${O.length?`<div class="grid">${O.map(o=>`<div class="card"><h3>${esc(o.name)}</h3><p class="mute">${esc(o.occasion)}</p><div class="row"><button class="btn sm" data-x="${o.id}">Remove</button><button class="btn sm alt" data-sh="${o.id}">Share</button></div></div>`).join('')}</div>`:'<p class="mute">No saved outfits yet.</p>'}</section>`; $$('[data-o]').forEach(b=>b.onclick=()=>{CUR=R.find(r=>r.id==b.dataset.o); SERV=CUR.servings; go('recipe')}); $$('[data-r]').forEach(b=>b.onclick=()=>{S.set('sr',R.filter(r=>r.id!=b.dataset.r));V.saved()}); $$('[data-x]').forEach(b=>b.onclick=()=>{S.set('so',O.filter(o=>o.id!=b.dataset.x));V.saved()}); $$('[data-sh]').forEach(b=>b.onclick=()=>share(O.find(x=>x.id==b.dataset.sh))) };
function keyBox(c){return`<div class="card" style="max-width:640px;margin-top:16px;display:grid;gap:12px"><h3>Developer API key (testing)</h3><label>Provider<select id="sp"><option value="groq" ${c.p=='groq'?'selected':''}>Groq</option><option value="openai" ${c.p=='openai'?'selected':''}>OpenAI</option></select></label><label>Base URL<input id="sb" value="${esc(c.base)}"></label><label>Model<input id="sm" value="${esc(c.model)}"></label><label>Vision model<input id="sv" value="${esc(c.vmodel)}"></label><label>API key<input id="sk" type="password" value="${esc(c.key)}" placeholder="sk-..."></label><button class="btn" id="ss">Save key</button></div>`}
V.settings=()=>{const c=cfg();$('#app').innerHTML=`<section><h2>Settings</h2><div class="card" style="max-width:640px"><h3>AI service</h3><p>${AI?'Connected. Recipes, outfits and photo identification are available.':'Offline. Sample recipes and basic outfit generation are shown instead.'}</p><button class="btn" id="rp">Refresh status</button></div>${ALLOW_USER_KEYS?keyBox(c):''}<div class="card" style="max-width:640px;margin-top:16px"><h3>Your data</h3><p class="mute">Wardrobe photos, saved items and plans are stored in this browser only.</p><button class="btn alt" id="sd">Delete all data</button></div></section>`; $('#rp').onclick=async()=>{await ping();toast(AI?'AI service connected':'AI service is offline');V.settings()}; if(ALLOW_USER_KEYS){$('#sp').value=c.p; $('#sp').onchange=e=>{const p=P[e.target.value]; $('#sb').value=p.base; $('#sm').value=p.model; $('#sv').value=p.vmodel}; $('#ss').onclick=()=>{S.set('cfg',{p:$('#sp').value,key:$('#sk').value,base:$('#sb').value,model:$('#sm').value,vmodel:$('#sv').value}); toast('API settings saved');}}; $('#sd').onclick=()=>{if(confirm('Delete all wardrobe items, saved recipes, outfits and plans from this browser?')){localStorage.clear();W=[];OUT=[];RES=[];toast('All data deleted');V.settings()}}}; route(); ping().then(()=>{if(RT=='settings'||RT=='wardrobe')route()});
</script></body></html>
